name: verify

# Runs on every PR into main and on pushes to main (post-merge safety net).
# This is the thing that actually enforces "nothing merges red" — not memory.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm run test -- --coverage

      - name: expo config resolves
        run: npx expo config --type public > /dev/null
